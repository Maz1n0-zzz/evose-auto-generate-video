<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>DecodeFX Overlay Frame · 1080x1920</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  @font-face { font-family: "Hanken Grotesk"; src: url("../fonts/HankenGrotesk-VF.ttf") format("truetype"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("../fonts/JetBrainsMono-Regular.ttf") format("truetype"); font-weight: 400; }
  body { font-family: "Hanken Grotesk", system-ui, sans-serif; }

  /* Scrim để watermark và chân khung nổi trên mọi nền khung */
  .scrim-top { position: absolute; top: 0; left: 0; right: 0; height: 240px;
    background: linear-gradient(180deg, rgba(8,9,11,0.90) 0%, rgba(8,9,11,0.52) 55%, rgba(8,9,11,0) 100%); z-index: 5; }
  .scrim-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 250px;
    background: linear-gradient(0deg, rgba(8,9,11,0.94) 0%, rgba(8,9,11,0.58) 52%, rgba(8,9,11,0) 100%); z-index: 5; }

  /* Watermark lockup ngang, góc trên trái, y 56 tới 175 */
  .mark { position: absolute; top: 56px; left: 64px; z-index: 10; }
  .mark img { width: 360px; height: auto; display: block; }

  /* Chân khung — tên miền, y 1770–1824 */
  .foot { position: absolute; bottom: 96px; left: 64px; right: 64px; z-index: 10;
    display: flex; justify-content: center; }
  .site { font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 34px; font-weight: 400; letter-spacing: .10em; color: #F8CE0F; }
</style>
</head>
<body>
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>

  <div class="mark"><img src="../logo/decodefx-lockup-h-gold.png" alt="DecodeFX" /></div>

  <div class="foot"><div class="site">decodefx.com</div></div>
</body>
</html>
