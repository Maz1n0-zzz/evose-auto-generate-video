      const tl = gsap.timeline({ paused: true });

      // Nen + camera: chuyen dong lien tuc suot khung

      tl.fromTo($("cam"), { scale: 1 }, { scale: 1.012, duration: 5.9, ease: "none" }, 0);

      // Scene 1 (0-1.6): cau hoi per-word
      const wordAt = [0.05, 0.22, 0.39, 0.56, 0.73];
      words.forEach((w, i) => {
        tl.fromTo(w, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, wordAt[i]);
      });
      tl.fromTo($("qm"), { scale: 0, opacity: 0 }, { scale: 1.7, opacity: 1, duration: 0.28, ease: "power3.out" }, 0.92);
      tl.to($("qm"), { scale: 1, duration: 0.42, ease: "bounce.out" }, 1.2);

      // Scene 2 (1.6-2.9): cau hoi co len dinh, hai cot chua co chieu cao

      tl.fromTo($("base"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 1.75);
      tl.fromTo($("stub-dong"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 1.95);
      tl.fromTo($("stub-mo"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 2.1);
      tl.fromTo($("lab-dong"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.0);
      tl.fromTo($("lab-mo"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.15);

      // Scene 3 (2.9-5.9): cot mo moc ngan, cot dong vut len + the gia

      tl.fromTo($("chip"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 3.55);
      tl.fromTo($("gapline"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 3.95);
      tl.fromTo($("col-dong"), { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power3.out" }, 4.75);
      tl.fromTo($("tag"), { scale: 0, rotation: -14, opacity: 0 }, { scale: 1, rotation: -4, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.4);
      tl.fromTo($("bracket"), { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 5.45);

      // Scene 4 (5.9-7.339): bieu do lui ve nen, so dem 10x -> 60x phinh to
      tl.to($("chart"), { opacity: 0, scale: 0.94, duration: 0.5, ease: "power3.out" }, 5.9);
      const START_SCALE = 0.45;
      tl.fromTo($("numwrap"), { opacity: 0, scale: 0.25 }, { opacity: 1, scale: START_SCALE, duration: 0.13, ease: "power3.out" }, 6.02);
      // Hai nhát cắt cứng khớp lời đọc: "mười" (6.10s) rồi "sáu mươi" (6.66s).
      const numEl = $("num");
      tl.set(numEl, { textContent: "10" }, 0);
      tl.set(numEl, { textContent: "60" }, 6.66);
      tl.fromTo($("numwrap"), { scale: START_SCALE }, { scale: 0.6, duration: 0.5, ease: "power3.out", immediateRender: false }, 6.15);
      tl.fromTo($("numwrap"), { scale: 1.12 }, { scale: 1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, 6.66);
      tl.fromTo($("re"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.3);
      tl.fromTo($("pre"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 6.72);
      tl.fromTo($("x"), { scale: 1.4 }, { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 6.8);
      tl.fromTo($("under"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 6.82);

      window.__timelines = window.__timelines || {};
