      (function () {
        const FID = "08-mot-phan-tu";
        const D = 6.541;
        const $ = (n) => document.getElementById("mpt08-" + n);
        const rootEl = document.querySelector('[data-composition-id="' + FID + '"]');

        // Coin face, built twice (3/4 body + 1/4 slice), each clipped to its sector.
        let ticks = "";
        for (let i = 0; i < 60; i++) {
          const a = (i / 60) * Math.PI * 2;
          const x1 = (300 + Math.cos(a) * 206).toFixed(2), y1 = (300 + Math.sin(a) * 206).toFixed(2);
          const x2 = (300 + Math.cos(a) * 226).toFixed(2), y2 = (300 + Math.sin(a) * 226).toFixed(2);
          ticks += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" />';
        }
        const face =
          '<circle cx="300" cy="300" r="240" fill="#0a0a0a" />' +
          '<g data-mpt="ticks" stroke="#f2f2f0" stroke-opacity="0.32" stroke-width="3">' + ticks + "</g>" +
          '<circle cx="300" cy="300" r="190" fill="none" stroke="#2563eb" stroke-opacity="0.6" stroke-width="3" />' +
          '<text x="300" y="304" text-anchor="middle" dominant-baseline="central" fill="#f2f2f0" ' +
          'font-family="Hanken Grotesk, sans-serif" font-weight="800" font-size="230">$</text>' +
          '<circle data-mpt="rim" cx="300" cy="300" r="240" fill="none" stroke="#2563eb" stroke-width="16" transform="rotate(-90 300 300)" />';
        rootEl.querySelectorAll('[data-mpt="face"]').forEach((g) => { g.innerHTML = face; });

        // svg-path-draw setup: measured lengths
        const prep = (el) => {
          const len = el.getTotalLength() * 1.02;
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
          return el;
        };
        const rims = Array.from(rootEl.querySelectorAll('[data-mpt="rim"]')).map(prep);
        ["ghost", "cut1", "cut2", "arrow-shaft", "arrow-head", "wave1", "wave2", "slash-line", "underline-path"].forEach((n) => prep($(n)));
        const tickGroups = rootEl.querySelectorAll('[data-mpt="ticks"]');

        const tl = gsap.timeline({ paused: true });

        // Ambient: grid drift + camera push (≤4%) + coin edge rotation, full duration
        tl.fromTo($("grid"), { x: 0, y: 0 }, { x: -40, y: -40, duration: D, ease: "none" }, 0);
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.012, duration: 3.9, ease: "sine.inOut" }, 0);
        tl.to($("cam"), { scale: 1.036, duration: D - 3.9, ease: "sine.inOut" }, 3.9);
        tl.fromTo(tickGroups, { rotation: 0 }, { rotation: 36, svgOrigin: "300 300", duration: D, ease: "none" }, 0);

        // Scene 1 (0–2.4): three bars shrink and merge into the coin (scale-swap)
        const bars = [
          { el: $("bar1"), top: 330, w: 160 },
          { el: $("bar2"), top: 368, w: 400 },
          { el: $("bar3"), top: 406, w: 640 },
        ];
        bars.forEach((b, i) => {
          const dx = 540 - (140 + b.w / 2);
          const dy = 760 - (b.top + 12);
          tl.fromTo(b.el, { x: 0, y: 0, scaleX: 1, scaleY: 1, opacity: 1 },
            { x: dx, y: dy, scaleX: 0.12, scaleY: 0.5, opacity: 0, duration: 0.55, ease: "power3.in" }, 0.08 + i * 0.06);
        });
        tl.fromTo($("coin"), { scale: 0.25, opacity: 0, filter: "blur(12px)", transformOrigin: "50% 50%" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, 0.3);
        tl.to(rims, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.9);
        tl.fromTo($("chip"), { opacity: 0, y: 24, clipPath: "inset(0% 100% 0% 0%)" },
          { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out" }, 1.6);
        tl.fromTo($("chip-dot"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 1.85);

        // Scene 2 (2.4–3.9): customer icon, then the down arrow draws at 3.4
        tl.fromTo($("user"), { opacity: 0, scale: 0.6, y: 30, transformOrigin: "50% 100%" },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.4);
        tl.fromTo($("user-label"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.65);
        tl.to($("arrow-shaft"), { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 3.4);
        tl.to($("arrow-head"), { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.72);

        // Scene 3 (3.9–6.54): quarter slice detaches and drifts down-right (below the chip); ≈ ¼ pops
        tl.to([$("cut1"), $("cut2")], { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" }, 3.85);
        tl.fromTo($("slice"), { x: 0, y: 0, rotation: 0, scale: 1 },
          { x: 110, y: 60, rotation: 6, scale: 0.96, svgOrigin: "420 180", duration: 0.4, ease: "power3.out" }, 3.97);
        tl.to($("slice"), { x: 225, y: 190, rotation: 14, scale: 0.84, svgOrigin: "420 180", duration: 1.0, ease: "power1.inOut" }, 4.37);
        tl.fromTo($("slice"), { opacity: 1 }, { opacity: 0, duration: 0.55, ease: "power1.in" }, 4.82);
        tl.fromTo([$("cut1"), $("cut2")], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 4.1);
        tl.fromTo($("main"), { x: 0, y: 0 }, { x: -10, y: 10, duration: 0.5, ease: "power3.out" }, 4.0);
        tl.to($("ghost"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 4.35);

        tl.fromTo($("num"), { opacity: 0, scale: 0.55, y: 40 },
          { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.6)" }, 4.0);
        tl.to([$("wave1"), $("wave2")], { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.1 }, 4.05);
        tl.to($("slash-line"), { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 4.2);

        // "cho các mô hình hàng đầu của Mỹ" (5.0)
        tl.fromTo($("line").children, { opacity: 0, x: -28 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 5.0);
        tl.to($("underline-path"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 5.5);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
