<!-- SINH TỰ ĐỘNG bởi scripts/gen-aspect.py — ĐỪNG SỬA TRỰC TIẾP.
     Sửa compositions/portrait.html rồi chạy lại script. -->
<!doctype html><html lang="vi"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/><title>Evose Chart Donut</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
/* ------------------------------------------------------------------
   EVOSE CHART DONUT — một tỉ lệ phần trăm chủ đạo.
   Token gốc: EVOSE-LIGHT-TOKENS.css.

   Port từ frame-chart-donut-v2: giữ nguyên cách quét cung bằng
   stroke-dashoffset với @keyframes bơm động, và bước tự thu cỡ chữ cho
   vừa lòng vòng. Chỉ thay lớp trình bày (bỏ nền tối + blob + gradient).

   Dùng chung một file cho 9:16 và 16:9 — xem scripts/gen-aspect.py.
   ------------------------------------------------------------------ */
:root{--paper:#f2f2f0;--dot:#d6d6d1;--ink:#0a0a0a;--ink-soft:#6b7280;
--chip-2:#e7e7e3;--accent:#2563eb;--mark:rgba(37,99,235,.28);
--font:'Hanken Grotesk',-apple-system,'Segoe UI',sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
--ease:cubic-bezier(.16,1,.3,1);}
*{margin:0;padding:0;box-sizing:border-box;}

/* ↓↓↓ 3 dòng khung — chỗ DUY NHẤT khác nhau giữa 9:16 và 16:9 ↓↓↓ */
html,body{width:1920px;height:1080px;}
#root{width:1920px;height:1080px;}
/* ↑↑↑ (dòng thứ 3 là data-width/data-height trên #root dưới <body>) */

html,body{overflow:hidden;font-family:var(--font);color:var(--ink);}
#root{position:relative;overflow:hidden;
background-color:var(--paper);
background-image:radial-gradient(circle,var(--dot) 1.35px,transparent 1.35px);
background-size:26px 26px;}

.eyebrow{position:absolute;left:var(--pad-x);top:var(--eyebrow-y);
font-family:var(--font-mono);font-weight:500;font-size:var(--eyebrow-fs);
letter-spacing:5px;text-transform:uppercase;color:var(--ink-soft);
opacity:0;animation:fadeIn .5s var(--ease) .1s forwards;}
.title{position:absolute;left:var(--pad-x);right:var(--pad-x);top:var(--title-y);
font-weight:900;font-size:var(--title-fs);line-height:1.06;letter-spacing:-1.5px;
opacity:0;transform:translateY(26px);animation:fadeUp .6s var(--ease) .3s forwards;}
.title .hl{background:linear-gradient(transparent 58%,var(--mark) 58%);}
.caption{position:absolute;left:var(--pad-x);right:var(--pad-x);bottom:var(--cap-y);
font-size:var(--cap-fs);font-weight:600;color:var(--ink-soft);line-height:1.32;text-align:center;
opacity:0;transform:translateY(18px);animation:fadeUp .6s var(--ease) 1.9s forwards;}

.donut{position:absolute;left:50%;top:var(--donut-y);transform:translateX(-50%);
width:var(--donut-size);height:var(--donut-size);
display:flex;align-items:center;justify-content:center;}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);}
.track{fill:none;stroke:#dcdcd7;stroke-width:var(--ring-w);}
.arc{fill:none;stroke:var(--accent);stroke-width:var(--ring-w);stroke-linecap:round;}
.pct{position:absolute;display:flex;align-items:baseline;justify-content:center;}
.num{font-family:var(--font-mono);font-weight:700;font-size:var(--num-fs);
color:var(--ink);line-height:1;opacity:0;animation:fadeIn .5s var(--ease) 1.2s forwards;}
.unit{font-family:var(--font-mono);font-weight:700;font-size:var(--unit-fs);
color:var(--ink-soft);line-height:1;opacity:0;animation:fadeIn .5s var(--ease) 1.2s forwards;}
.dlabel{position:absolute;left:var(--pad-x);right:var(--pad-x);top:var(--dlabel-y);
text-align:center;font-size:var(--dlabel-fs);font-weight:700;color:var(--ink-soft);
opacity:0;animation:fadeIn .6s var(--ease) 1.45s forwards;}

@keyframes fadeIn{to{opacity:1;}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
<div class="eyebrow"></div><h1 class="title"></h1>
<div class="donut">
  <svg viewBox="0 0 620 620" xmlns="http://www.w3.org/2000/svg">
    <circle class="track" cx="310" cy="310" r="278"/>
    <circle class="arc" id="arc" cx="310" cy="310" r="278"/>
  </svg>
  <div class="pct"><span class="num" id="numEl"></span><span class="unit" id="unitEl"></span></div>
</div>
<div class="dlabel"></div><div class="caption"></div>
</div>
<script>(function(){
var v=(window.__hyperframes&&typeof window.__hyperframes.getVariables==="function")?window.__hyperframes.getVariables():{};
var root=document.getElementById("root");

var GEO={
  portrait:{css:{"--pad-x":"90px","--eyebrow-y":"200px","--eyebrow-fs":"26px",
                 "--title-y":"258px","--title-fs":"70px","--cap-y":"180px","--cap-fs":"38px",
                 "--donut-y":"600px","--donut-size":"620px","--ring-w":"46px",
                 "--num-fs":"170px","--unit-fs":"74px",
                 "--dlabel-y":"1290px","--dlabel-fs":"40px"},
             js:{numFs:170,inner:2*(278-23)}},
  landscape:{css:{"--pad-x":"140px","--eyebrow-y":"90px","--eyebrow-fs":"22px",
                  "--title-y":"132px","--title-fs":"54px","--cap-y":"64px","--cap-fs":"30px",
                  "--donut-y":"240px","--donut-size":"560px","--ring-w":"42px",
                  "--num-fs":"130px","--unit-fs":"56px",
                  "--dlabel-y":"770px","--dlabel-fs":"32px"},
             js:{numFs:130,inner:2*(278-23)}}
};
var W=+root.getAttribute("data-width")||1080,H=+root.getAttribute("data-height")||1920;
var G=GEO[W>=H?"landscape":"portrait"];
for(var k in G.css)root.style.setProperty(k,G.css[k]);

function set(sel,val){var e=document.querySelector(sel);
  if(!e)return; if(val==null||val===""){e.style.display="none";return;} e.textContent=String(val);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

set(".eyebrow",v.label);
set(".caption",v.caption);
set(".dlabel",v.label_donut);
document.querySelector(".title").innerHTML=
  esc(v.title||"").replace(/\{([^}]+)\}/g,'<span class="hl">$1</span>');

var pct=parseFloat(v.percent);
if(isNaN(pct))pct=75;
pct=Math.min(100,Math.max(0,pct));

var numEl=document.getElementById("numEl"),unitEl=document.getElementById("unitEl");
numEl.textContent=Math.round(pct);
unitEl.textContent=v.unit!=null?String(v.unit):"%";

/* Quét cung: dasharray = chu vi, dashoffset chạy từ chu vi về phần còn lại.
   @keyframes phải bơm động vì mốc cuối phụ thuộc `percent`. */
var r=278,circ=2*Math.PI*r;
var arc=document.getElementById("arc");
arc.style.strokeDasharray=circ;
arc.style.strokeDashoffset=circ;
var st=document.createElement("style");
st.textContent="@keyframes drawArc{from{stroke-dashoffset:"+circ+"px}to{stroke-dashoffset:"
  +(circ*(1-pct/100))+"px}}";
document.head.appendChild(st);
arc.style.animation="drawArc 1s cubic-bezier(.16,1,.3,1) .5s both";

/* Số + đơn vị phải nằm lọt trong lòng vòng: thu dần cho tới khi vừa. */
var size=G.js.numFs;
while(numEl.scrollWidth+unitEl.scrollWidth>G.js.inner&&size>60){
  size-=6;
  numEl.style.fontSize=size+"px";
  unitEl.style.fontSize=Math.round(size*0.44)+"px";
}

/* HyperFrames 0.6.94 thoát code 1 ("zero duration") nếu frame thuần CSS không
   khai báo timeline. Stub này đủ để nó nhận data-duration. */
window.__timelines=window.__timelines||{};
window.__timelines["main"]={pause:function(){},seek:function(){},paused:function(){return true;}};
})();</script></body></html>
