<!doctype html><html lang="vi"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/><title>Evose List</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
/* ------------------------------------------------------------------
   EVOSE LIST — danh sách 2–5 mục (xếp hạng, ưu/nhược, checklist).
   Token gốc: EVOSE-LIGHT-TOKENS.css.

   Thay frame-aicoding-list: giữ cấu trúc item {icon, title, desc, tag,
   level} để chuyển script cũ sang không phải viết lại, nhưng đổi hẳn
   trình bày — thẻ giấy trắng viền mảnh trên nền dot-grid thay cho thẻ
   tối bo tròn phát sáng.

   `level` quyết định màu chip icon + nhãn phải: danger / warn / good / info.
   Dùng chung một file cho 9:16 và 16:9 — xem scripts/gen-aspect.py.
   ------------------------------------------------------------------ */
:root{--paper:#f2f2f0;--dot:#d6d6d1;--ink:#0a0a0a;--ink-soft:#6b7280;
--chip-2:#e7e7e3;--chip-2-line:#d2d2cc;--mark:rgba(37,99,235,.28);
--danger:#ef4444;--warn:#f59e0b;--good:#22c55e;--info:#2563eb;
--font:'Hanken Grotesk',-apple-system,'Segoe UI',sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
--ease:cubic-bezier(.16,1,.3,1);}
*{margin:0;padding:0;box-sizing:border-box;}

/* ↓↓↓ 3 dòng khung — chỗ DUY NHẤT khác nhau giữa 9:16 và 16:9 ↓↓↓ */
html,body{width:1080px;height:1920px;}
#root{width:1080px;height:1920px;}
/* ↑↑↑ (dòng thứ 3 là data-width/data-height trên #root dưới <body>) */

html,body{overflow:hidden;font-family:var(--font);color:var(--ink);}
#root{position:relative;overflow:hidden;
background-color:var(--paper);
background-image:radial-gradient(circle,var(--dot) 1.35px,transparent 1.35px);
background-size:26px 26px;}

.title{position:absolute;left:var(--pad-x);right:var(--pad-x);top:var(--title-y);
font-weight:900;font-size:var(--title-fs);line-height:1.06;letter-spacing:-1.5px;
opacity:0;transform:translateY(26px);animation:fadeUp .6s var(--ease) .2s forwards;}
.title .hl{background:linear-gradient(transparent 58%,var(--mark) 58%);}
.subtitle{position:absolute;left:var(--pad-x);right:var(--pad-x);top:var(--sub-y);
font-size:var(--sub-fs);font-weight:600;color:var(--ink-soft);
opacity:0;transform:translateY(18px);animation:fadeUp .6s var(--ease) .4s forwards;}

.items{position:absolute;left:var(--pad-x);right:var(--pad-x);top:var(--items-y);
display:flex;flex-direction:column;gap:var(--item-gap);}
.item{display:flex;align-items:center;gap:var(--item-pad-x);
background:#fff;border:2px solid var(--chip-2-line);border-radius:var(--item-radius);
padding:var(--item-pad);box-shadow:0 6px 18px rgba(10,10,10,.07);
opacity:0;transform:translateY(26px);animation:fadeUp .55s var(--ease) forwards;}
/* Vệt màu bên trái nhắc lại `level` — đọc được cả khi không nhìn nhãn. */
.item{position:relative;overflow:hidden;}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;
width:var(--rail);background:var(--lv);}

.icon{flex:none;width:var(--icon);height:var(--icon);border-radius:var(--icon-radius);
display:flex;align-items:center;justify-content:center;font-size:var(--icon-fs);
background:color-mix(in srgb,var(--lv) 15%,#fff);}
.body{flex:1;min-width:0;}
.it{font-size:var(--it-fs);font-weight:800;line-height:1.15;}
.id{margin-top:8px;font-size:var(--id-fs);font-weight:600;color:var(--ink-soft);line-height:1.25;}
.tag{flex:none;padding:var(--tag-pad);border-radius:999px;
font-size:var(--tag-fs);font-weight:800;text-transform:uppercase;letter-spacing:.4px;
color:#fff;background:var(--lv);white-space:nowrap;}

@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
<h1 class="title"></h1><div class="subtitle"></div><div class="items"></div>
</div>
<script>(function(){
var v=(window.__hyperframes&&typeof window.__hyperframes.getVariables==="function")?window.__hyperframes.getVariables():{};
var root=document.getElementById("root");

var GEO={
  portrait:{css:{"--pad-x":"80px","--title-y":"250px","--title-fs":"72px",
                 "--sub-y":"420px","--sub-fs":"38px","--items-y":"560px",
                 "--item-gap":"34px","--item-pad":"38px 44px","--item-pad-x":"34px",
                 "--item-radius":"26px","--rail":"12px",
                 "--icon":"110px","--icon-radius":"26px","--icon-fs":"54px",
                 "--it-fs":"42px","--id-fs":"30px",
                 "--tag-pad":"14px 26px","--tag-fs":"26px"}},
  landscape:{css:{"--pad-x":"180px","--title-y":"90px","--title-fs":"56px",
                  "--sub-y":"180px","--sub-fs":"30px","--items-y":"260px",
                  "--item-gap":"28px","--item-pad":"30px 40px","--item-pad-x":"30px",
                  "--item-radius":"20px","--rail":"9px",
                  "--icon":"92px","--icon-radius":"22px","--icon-fs":"44px",
                  "--it-fs":"38px","--id-fs":"27px",
                  "--tag-pad":"10px 20px","--tag-fs":"20px"}}
};
var W=+root.getAttribute("data-width")||1080,H=+root.getAttribute("data-height")||1920;
var G=GEO[W>=H?"landscape":"portrait"];
for(var k in G.css)root.style.setProperty(k,G.css[k]);

var LEVELS={danger:"var(--danger)",warn:"var(--warn)",good:"var(--good)",info:"var(--info)"};

function set(sel,val){var e=document.querySelector(sel);
  if(!e)return; if(val==null||val===""){e.style.display="none";return;} e.textContent=String(val);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

set(".subtitle",v.subtitle);

/* `accent` là một cụm CÓ THẬT trong title — tô dải bút dạ đúng cụm đó.
   Cú pháp {từ} cũng chấp nhận, cho tương thích script viết theo bộ cũ. */
var titleRaw=esc(v.title||"Ba điều cần nhớ");
var titleHtml=titleRaw.replace(/\{([^}]+)\}/g,'<span class="hl">$1</span>');
if(v.accent&&titleHtml.indexOf("<span")<0){
  var a=esc(String(v.accent));
  var at=titleHtml.indexOf(a);
  if(at>=0)titleHtml=titleHtml.slice(0,at)+'<span class="hl">'+a+"</span>"+titleHtml.slice(at+a.length);
}
document.querySelector(".title").innerHTML=titleHtml;

var items=v.items;
if(typeof items==="string"){try{items=JSON.parse(items);}catch(e){items=[];}}
if(!Array.isArray(items)||!items.length)
  items=[{icon:"🚫",title:"Tính từ mơ hồ",desc:"Không đo được",tag:"Tránh",level:"danger"},
         {icon:"✅",title:"Ví dụ cụ thể",desc:"Có thể đối chiếu",tag:"Nên",level:"good"},
         {icon:"📏",title:"Tiêu chí đếm được",desc:"Số từ, bố cục, giọng",tag:"Nên",level:"info"}];
items=items.slice(0,5);

var box=document.querySelector(".items");
items.forEach(function(it,i){
  var row=document.createElement("div");row.className="item";
  row.style.setProperty("--lv",LEVELS[it.level]||LEVELS.info);
  row.style.animationDelay=(0.6+i*0.16).toFixed(2)+"s";

  var ic=document.createElement("div");ic.className="icon";
  ic.textContent=it.icon||"•";

  var body=document.createElement("div");body.className="body";
  var t=document.createElement("div");t.className="it";t.textContent=it.title||"";
  body.appendChild(t);
  if(it.desc){var dsc=document.createElement("div");dsc.className="id";dsc.textContent=it.desc;body.appendChild(dsc);}

  row.appendChild(ic);row.appendChild(body);
  if(it.tag){var tg=document.createElement("div");tg.className="tag";tg.textContent=it.tag;row.appendChild(tg);}
  box.appendChild(row);
});

/* HyperFrames 0.6.94 thoát code 1 ("zero duration") nếu frame thuần CSS không
   khai báo timeline. Stub này đủ để nó nhận data-duration. */
window.__timelines=window.__timelines||{};
window.__timelines["main"]={pause:function(){},seek:function(){},paused:function(){return true;}};
})();</script></body></html>
