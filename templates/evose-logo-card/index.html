<!-- SINH TỰ ĐỘNG bởi scripts/gen-aspect.py — ĐỪNG SỬA TRỰC TIẾP.
     Sửa compositions/portrait.html rồi chạy lại script. -->
<!doctype html><html lang="vi"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/><title>Evose Logo Card</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ------------------------------------------------------------------
   EVOSE LOGO CARD — dùng cho CẢ intro lẫn outro.

   Reference chạy y hệt một animation ở cả hai đầu video (0:00–0:04 và
   2:16–2:21): monogram hiện ra giữa khung → wordmark "Evose" lộ ra bên
   phải, cả cụm dịch trái để cân lại. Outro chỉ khác ở chỗ có thêm
   tagline + URL. Vì vậy gộp làm MỘT template, phân biệt bằng slot:
     intro → chỉ để trống tagline/url
     outro → điền tagline + url

   Logo NHÚNG THẲNG dạng SVG (không phải asset ngoài) để không phụ thuộc
   đường dẫn và không bị quy tắc bỏ qua thư mục assets của template nuốt mất.
   Nguồn: evose-brand-kit/logos/evose-horizontal-navy.svg — 2 path đầu là
   monogram, 5 path sau là chữ "Evose", nên tách nhóm animate riêng được.

   LƯU Ý: đừng viết dấu sao rồi gạch chéo trong comment CSS (ví dụ khi gõ
   đường dẫn có ký tự đại diện) — nó đóng comment sớm, nuốt luôn khối :root
   phía sau và frame render ra trắng trơn mà không báo lỗi.

   Dùng chung một file cho 9:16 và 16:9 — xem scripts/gen-aspect.py.
   ------------------------------------------------------------------ */
:root{--paper:#f2f2f0;--dot:#d6d6d1;--ink:#0a0a0a;--navy:#0A1532;--accent:#2563eb;--ink-soft:#6b7280;
--font:'Hanken Grotesk',-apple-system,'Segoe UI',sans-serif;
--ease:cubic-bezier(.16,1,.3,1);}
*{margin:0;padding:0;box-sizing:border-box;}

/* ↓↓↓ 3 dòng khung — chỗ DUY NHẤT khác nhau giữa 9:16 và 16:9 ↓↓↓ */
html,body{width:1920px;height:1080px;}
#root{width:1920px;height:1080px;}
/* ↑↑↑ (dòng thứ 3 là data-width/data-height trên #root dưới <body>) */

html,body{overflow:hidden;font-family:var(--font);color:var(--ink);}
#root{position:relative;overflow:hidden;
background-color:var(--paper);
background-image:radial-gradient(circle,var(--dot) 1.35px,transparent 1.35px);
background-size:26px 26px;
display:flex;flex-direction:column;align-items:center;justify-content:center;}

.logo{width:var(--logo-w);height:auto;color:var(--navy);display:block;
/* <svg> mặc định XÉN nội dung theo khung nhìn của nó. Hiệu ứng xoáy phóng
   monogram lên 3.2 lần kèm blur 40px nên tràn ra ngoài và bị cắt thành một ô
   vuông. overflow:visible cho nó vẽ tràn ra. */
overflow:visible;
/* Ban đầu phóng to 1.3 và đẩy sang phải để MONOGRAM nằm đúng giữa khung; khi
   wordmark hiện thì thu về 1 và kéo về 0 cho cả cụm cân lại — reference cũng
   phóng monogram lúc nó đứng một mình.
   0.5122 = 0.394 × 1.3, trong đó 0.394 = (284 − 60)/568: tâm element trừ tâm
   monogram, chia bề rộng viewBox (monogram 0→120, wordmark 199→554/568). */
transform:translateX(calc(var(--logo-w) * 0.5122)) scale(1.3);
animation:logoShift .75s var(--ease) 1.10s forwards;}
.logo .sym{opacity:0;
/* transform-box:fill-box → tâm biến đổi lấy theo hộp bao của CHÍNH nhóm này.
   Không có nó thì transform-origin tính trong hệ toạ độ SVG đã bị nhóm cha
   bóp scale(0.1,-0.1), tâm xoay rơi ra ngoài khung và logo bay đi mất. */
transform-box:fill-box;transform-origin:center;
animation:symIn .6s var(--ease) .15s forwards;}
.logo .wm{opacity:0;transform:translateX(-26px);
animation:wmIn .6s var(--ease) 1.15s forwards;}

.tagline{margin-top:var(--tag-gap);width:var(--logo-w);text-align:right;
font-size:var(--tag-fs);font-weight:600;
color:var(--ink-soft);letter-spacing:.4px;
opacity:0;transform:translateY(14px);
animation:fadeUp .55s var(--ease) 1.95s forwards;}

.url{margin-top:var(--url-gap);display:flex;align-items:center;gap:14px;
font-size:var(--url-fs);font-weight:700;color:var(--navy);
opacity:0;transform:translateY(14px);
animation:fadeUp .55s var(--ease) 2.20s forwards;}
.url svg{width:var(--url-fs);height:var(--url-fs);stroke:currentColor;
stroke-width:6;fill:none;}

@keyframes symIn{to{opacity:1;}}
@keyframes wmIn{to{opacity:1;transform:translateX(0);}}
@keyframes logoShift{to{transform:translateX(0) scale(1);}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

/* --- nút FOLLOW: con trỏ di vào, bấm, chữ đổi thành FOLLOWING ---
   Hai nhãn xếp CHỒNG trong cùng ô lưới nên bề ngang nút bằng nhãn dài nhất,
   đổi chữ không làm nút nhảy kích thước. */
.follow{margin-top:var(--follow-gap);position:relative;display:grid;
place-items:center;padding:var(--follow-pad);border-radius:999px;
background:var(--accent);color:#fff;font-weight:900;letter-spacing:1.5px;
font-size:var(--follow-fs);box-shadow:0 14px 34px rgba(37,99,235,.38);
opacity:0;transform:scale(.88);
animation:followIn .5s var(--ease) 2.35s forwards, followPress .3s ease-in-out 3.95s;}
.follow .lbl{grid-area:1/1;white-space:nowrap;}
.follow .lbl-b{opacity:0;animation:swapIn .001s linear 4.05s forwards;}
.follow .lbl-a{animation:swapOut .001s linear 4.05s forwards;}
.cursor{position:absolute;
/* Đích nằm TRONG lòng nút (mũi trỏ ở góc trên trái của icon nên đặt 56%/34%
   là chạm gần tâm phải của nút). Trước đó neo bằng right/bottom âm nên con
   trỏ dừng hẳn bên ngoài, nhìn không ra là đang bấm vào nút. */
left:56%;top:34%;width:var(--cursor-w);height:auto;
/* Xuất phát HẲN ngoài khung rồi mới trượt vào — trước đó chỉ lệch 90px nên
   trông như con trỏ có sẵn cạnh nút chứ không phải đi vào bấm. */
opacity:0;transform:translate(430px,520px);
animation:cursorIn .3s ease-out 2.75s forwards,
          cursorMove 1.15s cubic-bezier(.3,.7,.25,1) 2.75s forwards,
          cursorTap .3s ease-in-out 3.95s;}
@keyframes followIn{to{opacity:1;transform:scale(1);}}
@keyframes followPress{50%{transform:scale(.93);}}
@keyframes swapIn{to{opacity:1;}}
@keyframes swapOut{to{opacity:0;}}
@keyframes cursorIn{to{opacity:1;}}
@keyframes cursorMove{to{transform:translate(0,0);}}
@keyframes cursorTap{50%{transform:translate(0,0) scale(.82);}}

/* --- CẢNH MỞ: logo xoáy vào ---
   Monogram bay vào trong lúc đang xoay và nhoè, rồi tụ lại đúng nét. Bật bằng
   slot `intro: "swirl"`; cảnh KẾT không bật để logo hiện thẳng, không rườm rà.
   Xoay nhiều vòng (-560deg) + blur lớn ban đầu tạo cảm giác vệt xoáy; blur tan
   nhanh hơn góc xoay nên nét logo hiện rõ trước khi dừng hẳn. */
#root.swirl .logo .sym{
  animation:swirlIn 1.7s cubic-bezier(.33,.06,.2,1) .05s forwards;}
/* Các mốc phần trăm chia đều tiến trình để pha vệt nhoè kịp NHÌN THẤY. Dồn hết
   vào một đường cong ease mạnh thì 80% chuyển động xảy ra trong 20% thời gian
   đầu — mắt chỉ kịp thấy logo quay, mất hẳn cảm giác xoáy. */
@keyframes swirlIn{
  0%  {opacity:0;  transform:rotate(-620deg) scale(3.2);filter:blur(40px);}
  18% {opacity:.85;transform:rotate(-430deg) scale(2.5);filter:blur(30px);}
  42% {opacity:1;  transform:rotate(-250deg) scale(1.9);filter:blur(18px);}
  68% {opacity:1;  transform:rotate(-105deg) scale(1.35);filter:blur(8px);}
  100%{opacity:1;  transform:rotate(0) scale(1);filter:blur(0);}
}
/* Xoáy xong mới tới lượt wordmark, nếu không hai chuyển động chồng lên nhau. */
#root.swirl .logo{animation-delay:1.95s;}
#root.swirl .logo .wm{animation-delay:2.00s;}

/* --- CẢNH MỞ CÓ TỰA BÀI ---
   Giữ nguyên hoạt cảnh gốc: monogram hiện giữa khung rồi cụm dịch trái trong
   lúc phần bên phải lộ ra. Khác ở chỗ phần lộ ra là TỰA BÀI VIẾT chứ không
   phải wordmark "Evose". Dùng đúng font và màu brand.
   Khoảng dịch đo bằng JS ngay lúc dựng (đồng bộ, không chờ tải gì) nên
   HyperFrames tua khung nào cũng ra đúng. */
#root.has-headline .logo .wm{display:none;}
.lockup{display:flex;align-items:center;justify-content:center;
gap:var(--lk-gap);width:100%;padding:0 var(--lk-pad);
transform:translateX(var(--lk-shift,0px));
animation:lockupShift .8s var(--ease) 1.05s forwards;}
.lockup .logo{width:var(--sym-w);flex:none;animation:none;transform:none;}
.vtitle{font-weight:800;color:var(--navy);font-size:var(--vt-fs);
line-height:1.14;letter-spacing:-1px;text-align:left;max-width:var(--vt-max);
opacity:0;transform:translateX(-30px);
animation:vtitleIn .7s var(--ease) 1.10s forwards;}
@keyframes lockupShift{to{transform:translateX(0);}}
@keyframes vtitleIn{to{opacity:1;transform:translateX(0);}}
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">

<script>(function(){
var v=(window.__hyperframes&&typeof window.__hyperframes.getVariables==="function")?window.__hyperframes.getVariables():{};
var root=document.getElementById("root");

var GEO={
  portrait:{css:{"--logo-w":"600px","--tag-gap":"34px","--tag-fs":"34px",
                 "--url-gap":"46px","--url-fs":"38px",
                 "--sym-w":"190px","--lk-gap":"40px","--lk-pad":"70px","--vt-fs":"66px","--vt-max":"640px",
                 "--follow-gap":"56px","--follow-pad":"30px 96px","--follow-fs":"46px","--cursor-w":"66px"}},
  landscape:{css:{"--logo-w":"520px","--tag-gap":"26px","--tag-fs":"28px",
                  "--url-gap":"34px","--url-fs":"32px",
                  "--sym-w":"150px","--lk-gap":"32px","--lk-pad":"180px","--vt-fs":"52px","--vt-max":"900px",
                  "--follow-gap":"38px","--follow-pad":"22px 70px","--follow-fs":"34px","--cursor-w":"50px"}}
};
var W=+root.getAttribute("data-width")||1080,H=+root.getAttribute("data-height")||1920;
var G=GEO[W>=H?"landscape":"portrait"];
for(var k in G.css)root.style.setProperty(k,G.css[k]);

if(v.intro==="swirl")root.classList.add("swirl");

/* Tựa bài: thay chỗ của wordmark. Cắt viewBox còn đúng phần monogram (0→140
   trong hệ toạ độ viewBox gốc rộng 568) để không thừa khoảng trống bên phải. */
var vt=document.querySelector(".vtitle");
if(v.headline){
  root.classList.add("has-headline");
  vt.textContent=String(v.headline);
  var svgEl=document.querySelector(".logo");
  svgEl.setAttribute("viewBox","0 0 140 141.238092");
  /* Ban đầu đẩy cả cụm sang phải đúng nửa bề ngang phần tựa + khoảng cách,
     để monogram nằm giữa khung; khi tựa hiện thì kéo về 0 cho cụm cân lại. */
  var gap=parseInt(getComputedStyle(root).getPropertyValue("--lk-gap"),10)||40;
  var w=vt.getBoundingClientRect().width;
  root.style.setProperty("--lk-shift",Math.round((w+gap)/2)+"px");
}else{vt.style.display="none";}

var tag=document.querySelector(".tagline");
if(v.tagline){tag.textContent=String(v.tagline);}else{tag.style.display="none";}

var urlEl=document.querySelector(".url");
if(v.url){
  urlEl.innerHTML='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42"/>'
    +'<ellipse cx="50" cy="50" rx="20" ry="42"/><path d="M8 50 H92"/></svg>';
  var span=document.createElement("span");
  span.textContent=String(v.url);
  urlEl.appendChild(span);
}else{urlEl.style.display="none";}

/* Nút FOLLOW — chỉ hiện khi script bật, vì cảnh MỞ không cần. */
var fw=document.querySelector(".follow");
if(v.follow){
  var a=String(v.follow_label||"FOLLOW");
  var b=String(v.follow_label_after||"FOLLOWING");
  fw.innerHTML='<span class="lbl lbl-a"></span><span class="lbl lbl-b"></span>'
    +'<svg class="cursor" viewBox="0 0 24 24" fill="#0A1532" stroke="#fff" stroke-width="1.4">'
    +'<path d="M5 2.5 L5 19 L9.2 15.2 L11.8 21 L14.6 19.7 L12 14 L18 13.6 Z"/></svg>';
  fw.querySelector(".lbl-a").textContent=a;
  fw.querySelector(".lbl-b").textContent=b;
}else{fw.style.display="none";}

/* HyperFrames 0.6.94 thoát code 1 ("zero duration") nếu frame thuần CSS không
   khai báo timeline. Stub này đủ để nó nhận data-duration. */
window.__timelines=window.__timelines||{};
window.__timelines["main"]={pause:function(){},seek:function(){},paused:function(){return true;}};
})();</script></body></html>
