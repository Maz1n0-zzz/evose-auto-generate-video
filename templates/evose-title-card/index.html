<!-- SINH TỰ ĐỘNG bởi scripts/gen-aspect.py — ĐỪNG SỬA TRỰC TIẾP.
     Sửa compositions/portrait.html rồi chạy lại script. -->
<!doctype html><html lang="vi"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/><title>Evose Title Card</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,800;0,900;1,800;1,900&display=swap" rel="stylesheet"/>
<style>
/* ------------------------------------------------------------------
   EVOSE TITLE CARD — tiêu đề trắng viền đen dày, xếp 2–4 dòng, hơi nghiêng.
   Token gốc: templates/EVOSE-LIGHT-TOKENS.css (sửa ở đó trước).

   Viền chữ dùng -webkit-text-stroke + paint-order:stroke fill để nét viền
   nằm SAU phần tô — nếu không, viền ăn vào thân chữ và chữ bị bóp gầy đi.

   Cỡ chữ tự co theo dòng dài nhất (xem fitFontSize) nên không cần chỉnh tay.
   Dùng chung một file cho 9:16 và 16:9 — xem scripts/gen-aspect.py.
   ------------------------------------------------------------------ */
:root{--paper:#f2f2f0;--dot:#d6d6d1;--ink:#0a0a0a;
--font:'Hanken Grotesk',-apple-system,'Segoe UI',sans-serif;
--ease:cubic-bezier(.16,1,.3,1);}
*{margin:0;padding:0;box-sizing:border-box;}

/* ↓↓↓ 3 dòng khung — chỗ DUY NHẤT khác nhau giữa 9:16 và 16:9 ↓↓↓ */
html,body{width:1920px;height:1080px;}
#root{width:1920px;height:1080px;}
/* ↑↑↑ (dòng thứ 3 là data-width/data-height trên #root dưới <body>) */

html,body{overflow:hidden;font-family:var(--font);color:var(--ink);}
#root{position:relative;overflow:hidden;
background-color:var(--paper);
background-image:radial-gradient(circle,var(--dot) 1.35px,transparent 1.35px);
background-size:26px 26px;}

.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
transform-origin:50% 42%;opacity:0;
animation:mediaIn .6s var(--ease) forwards, kenburns 20s linear forwards;}
.media.contain{object-fit:contain;}

.stack{position:absolute;left:var(--stack-x);right:var(--stack-x);
display:flex;flex-direction:column;align-items:center;}
#root.has-media .stack{top:var(--stack-top);}
#root:not(.has-media) .stack{top:50%;translate:0 -50%;}

.tline{font-weight:900;font-style:var(--tstyle);text-transform:uppercase;color:#fff;
line-height:.98;letter-spacing:-.5px;text-align:center;white-space:nowrap;
-webkit-text-stroke:var(--stroke) var(--ink);
paint-order:stroke fill;
filter:drop-shadow(0 10px 22px rgba(10,10,10,.30));
opacity:0;transform:translateY(30px) scale(.94);
animation:lineIn .55s var(--ease) forwards;}

.mascot{position:absolute;bottom:0;width:var(--mascot-w);height:var(--mascot-h);
object-fit:contain;object-position:bottom center;pointer-events:none;
opacity:0;transform:translateY(70px);animation:mascotIn .6s var(--ease) forwards;}
.mascot.right{right:40px;}
.mascot.left{left:40px;}

@keyframes mediaIn{to{opacity:1;}}
@keyframes kenburns{from{scale:1;}to{scale:1.07;}}
@keyframes lineIn{to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes mascotIn{to{opacity:1;transform:translateY(0);}}
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
<div class="stack"></div>
</div>
<script>(function(){
var v=(window.__hyperframes&&typeof window.__hyperframes.getVariables==="function")?window.__hyperframes.getVariables():{};
var root=document.getElementById("root");

var GEO={
  portrait:{
    css:{"--stack-x":"60px","--stack-top":"170px","--mascot-w":"520px","--mascot-h":"640px"},
    js:{avail:960,fsMax:118,fsMin:44}
  },
  landscape:{
    css:{"--stack-x":"140px","--stack-top":"110px","--mascot-w":"400px","--mascot-h":"520px"},
    js:{avail:1640,fsMax:132,fsMin:40}
  }
};
var W=+root.getAttribute("data-width")||1080,H=+root.getAttribute("data-height")||1920;
var G=GEO[W>=H?"landscape":"portrait"];
for(var k in G.css)root.style.setProperty(k,G.css[k]);
var CFG=G.js;

function arr(x){if(typeof x==="string"){try{var p=JSON.parse(x);if(Array.isArray(p))return p;}catch(e){}
  return String(x).split(/\r?\n/);}return Array.isArray(x)?x:[];}

if(v.media){
  var img=document.createElement("img");
  img.className="media"+(v.media_fit==="contain"?" contain":"");
  img.src=String(v.media);
  root.insertBefore(img,root.firstChild);
  root.classList.add("has-media");
}

var tilt=(v.tilt!=null?parseFloat(v.tilt):-2);
root.style.setProperty("--tstyle",v.italic===false?"normal":"italic");

var lines=arr(v.lines).map(function(s){return String(s==null?"":s).trim();})
                      .filter(function(s){return s.length;});
if(!lines.length)lines=["Tạo trợ lý AI Agent","trong 5 phút","trên Evose"];

/* Ước cỡ chữ từ dòng DÀI NHẤT. Hanken Grotesk 900 in hoa rộng ~0.55em mỗi ký
   tự; nhân hệ số đó rồi kẹp trong [fsMin, fsMax]. `white-space:nowrap` khiến
   dòng không tự xuống hàng, nên bước này quyết định chữ có tràn khung không. */
function fitFontSize(ls){
  var maxLen=ls.reduce(function(m,s){return Math.max(m,s.length);},1);
  return Math.max(CFG.fsMin,Math.min(CFG.fsMax,Math.round(CFG.avail/(maxLen*0.55))));
}
var fsz=fitFontSize(lines);
/* Viền dày 0.20em — mỏng hơn thì chữ đọc như "trắng có đường kẻ", mất hẳn
   cái chắc nịch của reference. */
root.style.setProperty("--stroke",Math.max(12,Math.round(fsz*0.20))+"px");

var stack=document.querySelector(".stack");
lines.forEach(function(t,i){
  var e=document.createElement("div");
  e.className="tline";
  e.textContent=t;
  e.style.fontSize=fsz+"px";
  /* Nghiêng lệch dần theo dòng — reference xếp chữ kiểu sticker chồng tay,
     không thẳng hàng tuyệt đối. */
  e.style.rotate=(tilt+i*-0.9).toFixed(2)+"deg";
  e.style.animationDelay=(0.20+i*0.16).toFixed(2)+"s";
  stack.appendChild(e);
});

if(v.mascot){
  var m=document.createElement("img");
  m.className="mascot "+(v.mascot_side==="left"?"left":"right");
  m.src=String(v.mascot);
  var sc=parseFloat(v.mascot_scale);
  if(sc>0){m.style.width=(parseInt(G.css["--mascot-w"],10)*sc)+"px";
           m.style.height=(parseInt(G.css["--mascot-h"],10)*sc)+"px";}
  m.style.animationDelay=(0.20+lines.length*0.16+0.25).toFixed(2)+"s";
  root.appendChild(m);
}

/* HyperFrames 0.6.94 thoát code 1 ("zero duration") nếu frame thuần CSS không
   khai báo timeline. Stub này đủ để nó nhận data-duration. */
window.__timelines=window.__timelines||{};
window.__timelines["main"]={pause:function(){},seek:function(){},paused:function(){return true;}};
})();</script></body></html>
